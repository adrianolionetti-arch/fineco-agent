name: Monthly Paper Verdict

# Il primo di ogni mese decifra il registro del portafoglio parallelo, calcola il
# rendimento time-weighted di agente / portafoglio reale / VWCE e manda il verdetto.
# E' l'unico momento in cui il contenuto delle decisioni diventa visibile: per tutto
# il mese resta cifrato, altrimenti vedendolo Adriano agirebbe di conseguenza e il
# confronto perderebbe senso.

on:
  schedule:
    - cron: '0 8 1 * *'    # primo del mese, 08:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Mese da valutare (YYYY-MM, vuoto = mese appena concluso)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: 'monthly-verdict'
  cancel-in-progress: false

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Genera e invia il verdetto
        env:
          PAPER_KEY: ${{ secrets.PAPER_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/paper_report.py ${{ inputs.month }} --email

      - name: Pubblica il verdetto sulla dashboard
        run: |
          git config user.name "fineco-agent-bot"
          git config user.email "bot@noreply.local"
          git add data/paper_public.json || true
          if git diff --staged --quiet; then
            echo "Nessun verdetto nuovo da pubblicare"
            exit 0
          fi
          git commit -m "chore: pubblica verdetto paper $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push completato al tentativo $attempt"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::Push fallito dopo 3 tentativi"
