name: Daily Briefing

on:
  schedule:
    # 06:15 UTC = 08:15 ora italiana estate (07:15 inverno)
    # Spostato da 07:30 UTC perché lì il carico globale GitHub Actions
    # è alto e gli schedule saltano spesso.
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
    inputs:
      model:
        description: 'Override modello Claude (vuoto = default Sonnet)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'claude-haiku-4-5'
          - 'claude-sonnet-4-5'
          - 'claude-opus-4-7'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-briefing'
  cancel-in-progress: false

jobs:
  briefing-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CLAUDE_MODEL: ${{ inputs.model  || 'claude-sonnet-4-5' }}
          # Email solo nei run schedulati. Nei dispatch manuali (debug/test)
          # generiamo dashboard e log ma non spammiamo la inbox.
          SKIP_EMAIL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python src/main.py

      - name: Inject dashboard password hash
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::error::Secret DASHBOARD_PASSWORD mancante."
            exit 1
          fi
          HASH=$(echo -n "$DASHBOARD_PASSWORD" | sha256sum | awk '{print $1}')
          sed -i "s/__PASSWORD_HASH_PLACEHOLDER__/$HASH/g" docs/index.html
          echo "Hash password iniettato"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Commit journal and history
        run: |
          git config user.name "fineco-agent-bot"
          git config user.email "bot@noreply.local"
          git add journal/ data/ || true
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei dati persistenti"
            exit 0
          fi
          git commit -m "chore: update journal & history $(date -u +%Y-%m-%d)"
          # Retry con rebase in caso di race condition (umano sta pushando in parallelo).
          # Senza questo, basta un commit umano nel minuto tra checkout e fine job per
          # far fallire il push con "rejected (fetch first)".
          for attempt in 1 2 3; do
            if git push; then
              echo "Push completato al tentativo $attempt"
              exit 0
            fi
            echo "Push respinto, rebase e riprovo (tentativo $attempt)..."
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::Push journal fallito dopo 3 tentativi. I dati verranno scritti al prossimo run."
